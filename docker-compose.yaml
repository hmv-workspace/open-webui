services:
  aisens:
    image: aisens:latest
    container_name: aisens
    volumes:
      - aisens:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://localhost:11434'
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  aisens: {}